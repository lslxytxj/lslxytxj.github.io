mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9097

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies:
  - name: "CF-VLESS"
    type: vless
    server: usc-ownership-customise-sega.trycloudflare.com
    port: 443
    uuid: 2adf5581-43f0-428f-827b-59c4caebd9de
    network: ws
    tls: true
    servername: usc-ownership-customise-sega.trycloudflare.com
    client-fingerprint: chrome
    udp: true
    ws-opts:
      path: /clashws
      headers:
        Host: usc-ownership-customise-sega.trycloudflare.com

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "CF-VLESS"
      - DIRECT

rules:
  - MATCH,PROXY
